# Configuration file

general {
    # 输出伪并行迁移调试日志（逐元件的转换明细）
    B:debug_fake_parallel_migration=false

    # 输出 ME 样板总成调试日志（pushPattern、配方检查/开始/结束时的 slot 匹配）
    B:debug_pattern_assembly=false

    # 输出配方输出加和调试日志（可加和配方识别、每次附加产出明细）
    B:debug_recipe_summation=false

    # 输出虚拟并行调试日志（材料清单生成、虚拟系数计算）
    B:debug_virtual_parallel=false

    # 自动把机器 JSON 中成对的输入×N/输出×N 伪并行 modifier 转换为原生真实并行（无需修改 JSON）
    B:enable_fake_parallel_migration=false

    # 允许输入总成仓替换原 MMCE 各类物品/流体仓室（含输入与输出）的结构位置（无需修改机器 JSON）
    B:enable_input_assembly_compat=false

    # 允许异步 ME 流体输出仓替换原 MMCE 各类流体输出仓的结构位置（无需修改机器 JSON）
    B:enable_me_fluid_bus_compat=true

    # 允许异步 ME 物品输出总线替换原 MMCE 各类物品输出总线的结构位置（无需修改机器 JSON）
    B:enable_me_item_bus_compat=true

    # 允许 ME 输出总成仓替换原 MMCE 各类物品/流体/能源仓室（含输入与输出）的结构位置（无需修改机器 JSON）
    B:enable_me_output_assembly_compat=true

    # 允许 ME 样板总成替换原 MMCE 各类物品/流体输入输出仓室及 ME Pattern Provider 的结构位置（无需修改机器 JSON）
    B:enable_me_pattern_assembly_compat=false

    # 启用配方输出加和：全不消耗输入的配方，输入几种材料就同时输出几种产物（乘并行度，空间不足的产物跳过不扣除）
    B:enable_recipe_output_summation=true

    # 允许虚拟并行仓替换原 MMCE 各类物品/流体/能源仓室及 ME Pattern Provider 的结构位置（无需修改机器 JSON）
    B:enable_virtual_hatch_compat=false

    # 启用虚拟并行体系：虚拟装配台把多方块机器装配为机器数据，放入虚拟并行仓提供独立乘区并行度
    B:enable_virtual_parallel=true

    # 不参与伪并行迁移的机器注册名列表（完整名或路径均可）
    S:fake_parallel_machine_blacklist <
     >

    # 多档伪并行元件同时存在时的并行度聚合策略：max（取最高档，默认）/ sum（累加）/ product（连乘，与原 modifier 语义等价但易爆炸）
    S:fake_parallel_strategy=max

    # 异步输出总线向 ME 网络批量注入的间隔（tick）。值越大，ME 网格压力越小，但产出进入网络的延迟越高。默认 5，最小 1，最大 1200。
    # Min: 1
    # Max: 1200
    I:injection_interval=5

    # 每 tick 批量注入最多处理的异步仓室数量。0 表示不限制。若产出延迟严重可适当调高。默认 2000，最小 0，最大 100000。
    # Min: 0
    # Max: 100000
    I:max_tiles_per_tick=2000

    # 不参与配方输出加和的机器注册名列表（完整名或路径均可）
    S:recipe_summation_machine_blacklist <
     >

    # 虚拟装配台内部材料缓存槽数量（每槽计数上限为 int）
    # Min: 27
    # Max: 1024
    I:virtual_assembler_buffer_slots=216

    # 虚拟装配台生成材料清单时额外排除的方块注册名列表（支持完整注册名或前缀），用于排除其他附属模组的仓室（如源质输入仓）
    S:virtual_assembler_excluded_blocks <
     >

    # 虚拟并行乘区的全局并行度上限（int 范围）。最终并行度经此钳制。默认 int 上限 = 不限制
    # Min: 1
    # Max: 2147483647
    I:virtual_parallel_cap=2147483647

    # 不参与虚拟并行的机器注册名列表（完整名或路径均可）：不可装配为机器数据，虚拟仓对其无效
    S:virtual_parallel_machine_blacklist <
     >
}


